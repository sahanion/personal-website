<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#392D2F" />
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#9497B3" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" />
  <!-- P-orbital 1 (Primary cream) -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#EDE5AB" stroke-width="2" transform="rotate(-30 32 32)" />
  <!-- P-orbital 2 (Secondary slate periwinkle) -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#9497B3" stroke-width="2" transform="rotate(30 32 32)" />
  <!-- Nucleus core -->
  <circle cx="32" cy="32" r="5" fill="#EDE5AB" />
</svg>
