<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#4d434c" />
  <!-- Outer orbital ring (contrast powder blue) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#b6cbde" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75" />
  <!-- P-orbital 1 (primary warm cream) -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#f7e8c7" stroke-width="2" transform="rotate(-30 32 32)" />
  <!-- P-orbital 2 (contrast powder blue) -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#b6cbde" stroke-width="2" transform="rotate(30 32 32)" />
  <!-- Nucleus core (primary warm cream) -->
  <circle cx="32" cy="32" r="5" fill="#f7e8c7" />
</svg>
