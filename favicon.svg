<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#4A4A4A" />
  <!-- Outer orbital ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#D5F3D8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85" />
  <!-- P-orbital 1 -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#F2C7C7" stroke-width="2" transform="rotate(-30 32 32)" />
  <!-- P-orbital 2 -->
  <ellipse cx="32" cy="32" rx="20" ry="9" fill="none" stroke="#D5F3D8" stroke-width="2" transform="rotate(30 32 32)" />
  <!-- Nucleus core -->
  <circle cx="32" cy="32" r="5" fill="#FFFAFA" />
</svg>

