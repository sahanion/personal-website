<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Santanu Saha — Contact information, academic profiles, and social links."
    />
    <title>Contact — Santanu Saha</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap");

      :root {
        --paper: #F6F7F2;
        --ink: #1B241E;
        --muted: #647167;
        --line: rgba(27, 36, 30, 0.12);
        --accent: #2F6A4F;
        --accent-soft: #D9E5D6;
        --earth-amber: #A06A42;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Manrope", Arial, sans-serif;
        --mono: "DM Mono", monospace;
      }

      * { box-sizing: border-box; }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      html::-webkit-scrollbar {
        width: 6px;
      }
      html::-webkit-scrollbar-track {
        background: transparent;
      }
      html::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
      html::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          radial-gradient(circle at 88% 14%, rgba(160, 106, 66, 0.08), transparent 28rem),
          radial-gradient(circle at 12% 88%, rgba(47, 106, 79, 0.09), transparent 26rem);
        background-attachment: fixed;
        font-family: var(--sans);
      }

      a { color: inherit; text-decoration: none; }

      .page {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: clamp(80px, 10vh, 100px) clamp(24px, 5vw, 80px) clamp(70px, 8vh, 85px);
        box-sizing: border-box;
        isolation: isolate;
      }

      .page::before,
      .page::after {
        display: none;
      }

      .grain {
        position: fixed;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        opacity: 0.24;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
      }

      .site-header,
      .site-footer {
        display: grid;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        grid-template-columns: 1fr auto 1fr;
        padding: 24px clamp(24px, 5vw, 80px) 16px;
        background: rgba(246, 247, 242, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-weight: 500;
        transition: color 200ms ease;
      }

      .brand:hover {
        color: var(--accent);
      }

      .field {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        justify-self: end;
      }

      .field::before {
        width: 6px;
        height: 6px;
        border: 1px solid var(--accent);
        border-radius: 50%;
        content: "";
        transition: background 300ms ease, transform 300ms ease;
      }

      .field:hover::before {
        background: var(--accent);
        transform: scale(1.35);
      }

      main {
        position: relative;
        z-index: 10;
        width: min(100%, 1160px);
        margin: auto 0;
      }

      .contact-hero-grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) auto;
        justify-content: space-between;
        align-items: start;
        gap: clamp(32px, 5vw, 72px);
        width: 100%;
      }

      .hero-left-content {
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 20px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 700ms 100ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .eyebrow::before {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(4.8rem, 11vw, 9.4rem);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 0.76;
        opacity: 0;
        animation: rise 900ms 180ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      h1 span { display: block; }

      h1 em {
        margin-left: clamp(12px, 4vw, 62px);
        font-style: italic;
      }

      /* Owner portrait positioned top right */
      .owner-portrait-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        align-self: start;
        margin-top: 6px;
        padding: 10px;
        opacity: 0;
        animation: rise 850ms 220ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .owner-portrait-wrapper::before {
        position: absolute;
        content: "";
        width: 114%;
        height: 114%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent-soft) 0%, rgba(160, 106, 66, 0.16) 50%, transparent 70%);
        filter: blur(16px);
        z-index: 0;
        pointer-events: none;
      }

      .portrait-frame {
        position: relative;
        z-index: 1;
        width: clamp(210px, 22vw, 290px);
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--paper);
        box-shadow:
          0 0 0 1px var(--line),
          0 0 0 8px var(--accent-soft),
          0 18px 40px -12px rgba(27, 36, 30, 0.14);
        background: var(--paper);
        transition: box-shadow 300ms ease, transform 300ms ease;
      }

      .portrait-frame:hover {
        transform: scale(1.025);
        box-shadow:
          0 0 0 1px var(--accent),
          0 0 0 10px var(--accent-soft),
          0 22px 46px -10px rgba(27, 36, 30, 0.20);
      }

      .portrait-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .contact-details {
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 680px;
        margin-top: clamp(28px, 4vh, 48px);
        opacity: 0;
        animation: rise 800ms 350ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .direct-contact-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        max-width: 380px;
        gap: 14px;
      }

      .contact-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        transition: border-color 240ms ease, transform 240ms ease, background 240ms ease;
      }

      .contact-card:hover {
        border-color: var(--accent);
        background: #ffffff;
        transform: translateY(-2px);
      }

      .card-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-tag svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .card-value {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink);
        word-break: break-all;
        transition: color 200ms ease;
      }

      .contact-card:hover .card-value {
        color: var(--accent);
      }

      .social-heading {
        margin: 6px 0 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .social-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(6px);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: border-color 250ms ease, background 250ms ease, color 250ms ease, transform 250ms ease;
      }

      .social-pill svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
        flex-shrink: 0;
        transition: transform 220ms ease;
      }

      .social-pill .external-arrow {
        color: var(--accent);
        font-size: 12px;
        opacity: 0.75;
        transition: transform 220ms ease, opacity 220ms ease;
      }

      .social-pill:hover {
        border-color: var(--accent);
        color: var(--ink);
        background: var(--accent-soft);
        transform: translateY(-2px);
      }

      .social-pill:hover svg {
        transform: scale(1.1);
      }

      .social-pill:hover .external-arrow {
        opacity: 1;
        transform: translate(2px, -2px);
      }

      .top-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 18px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 4px 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-link::before {
        color: var(--accent);
        content: "↗";
        font-size: 13px;
        opacity: 0;
        transform: translate(-5px, 4px);
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .nav-link:hover::before,
      .nav-link:focus-visible::before {
        opacity: 1;
        transform: translate(0, 0);
      }

      .nav-link.active {
        color: var(--accent);
        font-weight: 700;
      }

      .nav-link:focus-visible,
      .contact-card:focus-visible,
      .social-pill:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 4px;
      }

      .header-right {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Travel Stories Interactive Button */
      .travel-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(246, 247, 242, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--ink);
        text-decoration: none;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 500;
        transition: all 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
        overflow: visible;
        user-select: none;
        box-shadow: 0 1px 2px rgba(27, 36, 30, 0.04);
      }

      .travel-btn .travel-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 20px;
        overflow: visible;
        flex-shrink: 0;
      }

      .travel-btn .travel-icon-svg {
        width: 36px;
        height: 20px;
        display: block;
        color: var(--muted);
        transition: color 240ms ease;
        overflow: visible;
      }

      .travel-btn .travel-btn-text {
        position: relative;
        transition: color 240ms ease;
      }

      .travel-btn .travel-btn-arrow {
        font-size: 10px;
        opacity: 0.55;
        margin-left: -2px;
        transition: transform 240ms ease, opacity 240ms ease, color 240ms ease;
        display: inline-block;
      }

      /* Hover Interaction */
      .travel-btn:hover {
        background: #ffffff;
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 4px 14px rgba(47, 106, 79, 0.14), 0 1px 3px rgba(27, 36, 30, 0.05);
        transform: translateY(-1px);
      }

      .travel-btn:hover .travel-icon-svg {
        color: var(--accent);
      }

      .travel-btn:hover .travel-btn-arrow {
        opacity: 1;
        color: var(--accent);
        transform: translate(2px, -1.5px);
      }

      .travel-btn:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }

      /* Animated SVG Elements inside Button */
      .travel-btn .scene-sun {
        transition: transform 380ms cubic-bezier(0.34, 1.56, 0.64, 1), stroke 300ms ease, fill 300ms ease;
        transform-origin: 24px 6px;
      }
      .travel-btn:hover .scene-sun {
        transform: translateY(-2px) scale(1.2);
        stroke: var(--earth-amber, #A06A42);
        fill: rgba(160, 106, 66, 0.22);
      }

      .travel-btn .scene-wave-1 {
        transition: stroke 240ms ease;
      }
      .travel-btn:hover .scene-wave-1 {
        animation: waveFlow 1.5s ease-in-out infinite;
        stroke: var(--accent);
      }

      .travel-btn .scene-wave-2 {
        transition: stroke 240ms ease, opacity 240ms ease;
      }
      .travel-btn:hover .scene-wave-2 {
        animation: waveFlowReverse 1.9s ease-in-out infinite;
        stroke: #488f9c;
        opacity: 0.9;
      }

      @keyframes waveFlow {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }

      @keyframes waveFlowReverse {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-2.5px); }
      }

      .travel-btn .scene-tree-1 {
        transform-origin: 9px 17px;
        transition: stroke 240ms ease;
      }
      .travel-btn:hover .scene-tree-1 {
        animation: treeSway 1.8s ease-in-out infinite;
        stroke: #1e4d37;
      }

      .travel-btn .scene-tree-2 {
        transform-origin: 13px 17px;
        transition: stroke 240ms ease;
      }
      .travel-btn:hover .scene-tree-2 {
        animation: treeSway 1.6s ease-in-out infinite 0.2s;
        stroke: #2F6A4F;
      }

      .travel-btn .scene-tree-3 {
        transform-origin: 34px 17px;
        transition: stroke 240ms ease;
      }
      .travel-btn:hover .scene-tree-3 {
        animation: treeSway 2.1s ease-in-out infinite 0.1s;
        stroke: #2b5f47;
      }

      @keyframes treeSway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(5deg); }
        75% { transform: rotate(-4deg); }
      }

      .travel-btn .scene-mountain {
        transition: stroke 240ms ease;
      }
      .travel-btn:hover .scene-mountain-front {
        stroke: var(--accent);
      }
      .travel-btn:hover .scene-mountain-back {
        stroke: rgba(47, 106, 79, 0.75);
      }
      .travel-btn:hover .scene-ridge-front,
      .travel-btn:hover .scene-ridge-back {
        stroke: var(--accent);
      }

      /* Active State (When on travel.html) */
      .travel-btn.active {
        background: var(--accent-soft);
        border-color: rgba(47, 106, 79, 0.35);
        color: #1E4231;
        font-weight: 700;
        box-shadow: 0 0 0 1px rgba(47, 106, 79, 0.12);
      }
      .travel-btn.active .travel-icon-svg {
        color: #1E4231;
      }
      .travel-btn.active .scene-sun {
        stroke: var(--earth-amber, #A06A42);
      }
      .travel-btn.active .scene-mountain-front {
        stroke: #1E4231;
      }
      .travel-btn.active .scene-wave-1 {
        stroke: #1E4231;
      }
      .travel-btn.active:hover {
        background: #ffffff;
        border-color: var(--accent);
        color: var(--accent);
      }

      .site-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px clamp(24px, 5vw, 80px) 20px;
        background: rgba(246, 247, 242, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      .footer-rule {
        flex: 1;
        height: 1px;
        margin: 0 18px;
        background: var(--line);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .page { padding: 64px 20px 52px; justify-content: flex-start; }
        .site-header { grid-template-columns: 1fr auto; gap: 9px 14px; padding: 14px 20px 10px; }
        .header-right { grid-column: 2; grid-row: 1; justify-self: end; }
        .travel-btn { padding: 4px 10px 4px 7px; font-size: 9px; gap: 6px; }
        .travel-btn .travel-icon-wrap { width: 30px; height: 17px; }
        .travel-btn .travel-icon-svg { width: 30px; height: 17px; }
        .top-nav { grid-column: 1 / -1; grid-row: 2; gap: 0 15px; }
        .nav-link { font-size: 9px; }
        .field { font-size: 8px; }
        main { margin: 0 auto; padding: 16px 0 24px; max-height: none; }
        h1 { font-size: clamp(4.2rem, 18vw, 6.2rem); line-height: 0.78; }
        .contact-hero-grid { grid-template-columns: 1fr; gap: 24px; }
        .owner-portrait-wrapper { justify-content: flex-start; margin-top: 0; }
        .portrait-frame { width: min(180px, 48vw); }
        .site-footer { padding: 10px 20px 12px; font-size: 8px; }
        .footer-rule { max-width: 64px; margin: 0 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="index.html">Santanu Saha</a>
        <nav class="top-nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="research.html">Research</a>
          <a class="nav-link" href="cv.html">CV</a>
          <a class="nav-link active" href="contact.html">Contact</a>
          </nav>
        <div class="header-right">
          <a class="travel-btn" href="travel.html" aria-label="Travel Stories">
            <span class="travel-icon-wrap">
              <svg class="travel-icon-svg" viewBox="0 0 40 22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle class="scene-sun" cx="24" cy="6" r="2.6" stroke-width="1" />
                <path class="scene-mountain scene-mountain-back" d="M21 17 L29 7.5 L37 17" />
                <path class="scene-ridge scene-ridge-back" d="M29 7.5 L31.5 17" stroke-width="0.8" stroke-dasharray="1 1.2" />
                <path class="scene-mountain scene-mountain-front" d="M4 17 L16 5 L27 17" />
                <path class="scene-ridge scene-ridge-front" d="M16 5 L18.5 17" stroke-width="0.8" stroke-dasharray="1 1.2" />
                <g class="scene-tree scene-tree-1">
                  <path d="M9 17 L9 11.5" />
                  <path d="M7 14 L9 11.5 L11 14" />
                  <path d="M6.5 16.5 L9 13.8 L11.5 16.5" />
                </g>
                <g class="scene-tree scene-tree-2">
                  <path d="M13 17 L13 13" />
                  <path d="M11.5 15.2 L13 13 L14.5 15.2" />
                </g>
                <g class="scene-tree scene-tree-3">
                  <path d="M34 17 L34 13" />
                  <path d="M32.5 15.2 L34 13 L35.5 15.2" />
                </g>
                <path class="scene-wave scene-wave-1" d="M2 18 C6 16.6 10 16.6 14 18 C18 19.4 22 19.4 26 18 C30 16.6 34 16.6 38 18" />
                <path class="scene-wave scene-wave-2" d="M4 20.5 C8 19.5 12 19.5 16 20.5 C20 21.5 24 21.5 28 20.5 C32 19.5 36 19.5 39 20.5" stroke-width="0.9" opacity="0.75" />
              </svg>
            </span>
            <span class="travel-btn-text">Travel Stories</span>
            <span class="travel-btn-arrow">↗</span>
          </a>
        </div>
      </header>

      <main>
        <div class="contact-hero-grid">
          <div class="hero-left-content">
            <p class="eyebrow">Connect / Collaboration & Inquiries</p>
            <h1><span>Santanu</span><span><em>Saha</em></span></h1>

            <section class="contact-details" aria-label="Contact information and links">
              <div class="direct-contact-group">
                <!-- Email Contact Card -->
                <a class="contact-card" href="mailto:santanu.bt15@gmail.com" title="Email Santanu Saha">
                  <span class="card-tag">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    Email Address
                  </span>
                  <span class="card-value">santanu.bt15@gmail.com</span>
                </a>
              </div>

              <p class="social-heading">Research & Professional Profiles</p>
              <div class="social-links" aria-label="Professional and academic links">
                <!-- LinkedIn Profile -->
                <a
                  class="social-pill"
                  href="https://linkedin.com/in/sahanion"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="LinkedIn Profile"
