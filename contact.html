<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Santanu Saha — Contact information, academic profiles, and social links."
    />
    <title>Contact — Santanu Saha</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap");

      :root {
        --paper: #ffffff;
        --ink: #18201e;
        --muted: #707670;
        --line: #e2e2dc;
        --accent: #5ba8b8;
        --accent-soft: #cae9ed;
        --pastel-peach: #ffc7b2;
        --pastel-blue: #bfe4f0;
        --pastel-lilac: #dbccf5;
        --pastel-yellow: #ffe3a3;
        --pastel-mint: #bde8d0;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Manrope", Arial, sans-serif;
        --mono: "DM Mono", monospace;
      }

      * { box-sizing: border-box; }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
      }

      html::-webkit-scrollbar {
        width: 6px;
      }
      html::-webkit-scrollbar-track {
        background: transparent;
      }
      html::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 999px;
      }
      html::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          radial-gradient(circle at 88% 14%, rgba(255, 199, 178, 0.08), transparent 28rem),
          radial-gradient(circle at 12% 88%, rgba(191, 228, 240, 0.08), transparent 26rem);
        background-attachment: fixed;
        font-family: var(--sans);
      }

      a { color: inherit; text-decoration: none; }

      .page {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: clamp(80px, 10vh, 100px) clamp(24px, 5vw, 80px) clamp(70px, 8vh, 85px);
        box-sizing: border-box;
        isolation: isolate;
      }

      .page::before,
      .page::after {
        display: none;
      }

      .grain {
        position: fixed;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        opacity: 0.24;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
      }

      .site-header,
      .site-footer {
        display: grid;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        grid-template-columns: 1fr auto 1fr;
        padding: 24px clamp(24px, 5vw, 80px) 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-weight: 500;
        transition: color 200ms ease;
      }

      .brand:hover {
        color: var(--accent);
      }

      .field {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        justify-self: end;
      }

      .field::before {
        width: 6px;
        height: 6px;
        border: 1px solid var(--accent);
        border-radius: 50%;
        content: "";
        transition: background 300ms ease, transform 300ms ease;
      }

      .field:hover::before {
        background: var(--accent);
        transform: scale(1.35);
      }

      main {
        position: relative;
        z-index: 10;
        width: min(100%, 1160px);
        margin: auto 0;
      }

      .contact-hero-grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) auto;
        justify-content: space-between;
        align-items: start;
        gap: clamp(32px, 5vw, 72px);
        width: 100%;
      }

      .hero-left-content {
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 20px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 700ms 100ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .eyebrow::before {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(4.8rem, 11vw, 9.4rem);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 0.76;
        opacity: 0;
        animation: rise 900ms 180ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      h1 span { display: block; }

      h1 em {
        margin-left: clamp(12px, 4vw, 62px);
        font-style: italic;
      }

      /* Owner portrait positioned top right */
      .owner-portrait-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        align-self: start;
        margin-top: 6px;
        padding: 10px;
        opacity: 0;
        animation: rise 850ms 220ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .owner-portrait-wrapper::before {
        position: absolute;
        content: "";
        width: 114%;
        height: 114%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent-soft) 0%, rgba(255, 199, 178, 0.28) 50%, transparent 70%);
        filter: blur(16px);
        z-index: 0;
        pointer-events: none;
      }

      .portrait-frame {
        position: relative;
        z-index: 1;
        width: clamp(210px, 22vw, 290px);
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--paper);
        box-shadow:
          0 0 0 1px var(--line),
          0 0 0 8px var(--accent-soft),
          0 18px 40px -12px rgba(24, 32, 30, 0.16);
        background: var(--paper);
        transition: box-shadow 300ms ease, transform 300ms ease;
      }

      .portrait-frame:hover {
        transform: scale(1.025);
        box-shadow:
          0 0 0 1px var(--accent),
          0 0 0 10px var(--accent-soft),
          0 22px 46px -10px rgba(24, 32, 30, 0.22);
      }

      .portrait-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .contact-details {
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 680px;
        margin-top: clamp(28px, 4vh, 48px);
        opacity: 0;
        animation: rise 800ms 350ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .direct-contact-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        max-width: 380px;
        gap: 14px;
      }

      .contact-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 250, 244, 0.65);
        backdrop-filter: blur(8px);
        transition: border-color 240ms ease, transform 240ms ease, background 240ms ease;
      }

      .contact-card:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
      }

      .card-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-tag svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .card-value {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink);
        word-break: break-all;
        transition: color 200ms ease;
      }

      .contact-card:hover .card-value {
        color: var(--accent);
      }

      .social-heading {
        margin: 6px 0 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .social-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(245, 244, 239, 0.7);
        backdrop-filter: blur(6px);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: border-color 250ms ease, background 250ms ease, color 250ms ease, transform 250ms ease;
      }

      .social-pill svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
        flex-shrink: 0;
        transition: transform 220ms ease;
      }

      .social-pill .external-arrow {
        color: var(--accent);
        font-size: 12px;
        opacity: 0.75;
        transition: transform 220ms ease, opacity 220ms ease;
      }

      .social-pill:hover {
        border-color: var(--accent);
        color: var(--ink);
        background: var(--accent-soft);
        transform: translateY(-2px);
      }

      .social-pill:hover svg {
        transform: scale(1.1);
      }

      .social-pill:hover .external-arrow {
        opacity: 1;
        transform: translate(2px, -2px);
      }

      .top-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 18px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 4px 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-link::before {
        color: var(--accent);
        content: "↗";
        font-size: 13px;
        opacity: 0;
        transform: translate(-5px, 4px);
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .nav-link:hover::before,
      .nav-link:focus-visible::before {
        opacity: 1;
        transform: translate(0, 0);
      }

      .nav-link.active {
        color: var(--accent);
      }

      .nav-link:focus-visible,
      .contact-card:focus-visible,
      .social-pill:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 4px;
      }

      .header-right {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Atmospheric Mountain & Forest Travel Vignette (Artistic Interactive Portal) */
      .travel-art-vignette {
        display: inline-block;
        width: 196px;
        height: 38px;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        overflow: visible;
        user-select: none;
        transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
      }

      .travel-art-vignette:hover {
        transform: translateY(-1.5px);
      }

      .travel-art-vignette:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 4px;
        border-radius: 4px;
      }

      .travel-vignette-svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Revealed text group nestled behind foreground forest */
      .travel-art-vignette .forest-reveal-group {
        transform: translateY(14px);
        opacity: 0;
        filter: blur(1.5px);
        pointer-events: none;
        transition: transform 440ms cubic-bezier(0.16, 1, 0.3, 1), opacity 320ms ease, filter 320ms ease;
      }

      .travel-art-vignette:hover .forest-reveal-group,
      .travel-art-vignette:focus-visible .forest-reveal-group,
      .travel-art-vignette.active .forest-reveal-group {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }

      .travel-art-vignette .forest-reveal-title {
        font-family: var(--mono);
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: var(--ink);
        transition: fill 240ms ease;
      }

      .travel-art-vignette:hover .forest-reveal-title {
        fill: var(--accent);
      }

      .travel-art-vignette .forest-reveal-arrow {
        font-family: var(--mono);
        font-size: 8.5px;
        font-weight: 500;
        fill: var(--accent);
        transition: transform 280ms ease;
      }

      .travel-art-vignette:hover .forest-reveal-arrow {
        transform: translate(2px, -2px);
      }

      /* Sun Animation on Hover */
      .travel-art-vignette .vignette-sun {
        transform-origin: 156px 11px;
        transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), stroke 300ms ease;
      }

      .travel-art-vignette:hover .vignette-sun {
        transform: translateY(-2px) scale(1.18);
      }

      .travel-art-vignette:hover .vignette-sun circle {
        stroke: var(--earth-amber, #A06A42);
      }

      /* Birds soaring */
      .travel-art-vignette .vignette-bird {
        transition: transform 380ms ease;
      }

      .travel-art-vignette:hover .bird-1 {
        transform: translate(4px, -1.5px);
      }

      .travel-art-vignette:hover .bird-2 {
        transform: translate(5px, -2px);
      }

      /* Forest trees gentle swaying */
      .travel-art-vignette .forest-tree {
        transition: transform 260ms ease, stroke 260ms ease;
      }

      .travel-art-vignette:hover .forest-tree path {
        stroke: #18442c;
      }

      .travel-art-vignette:hover .tree-1 {
        animation: treeSway 2.2s ease-in-out infinite;
        transform-origin: 14px 35px;
      }
      .travel-art-vignette:hover .tree-2 {
        animation: treeSway 1.9s ease-in-out infinite 0.1s;
        transform-origin: 26px 35px;
      }
      .travel-art-vignette:hover .tree-3 {
        animation: treeSway 2.4s ease-in-out infinite 0.3s;
        transform-origin: 68px 35px;
      }
      .travel-art-vignette:hover .tree-4 {
        animation: treeSway 1.8s ease-in-out infinite 0.15s;
        transform-origin: 82px 35px;
      }
      .travel-art-vignette:hover .tree-5 {
        animation: treeSway 2.1s ease-in-out infinite 0.25s;
        transform-origin: 98px 35px;
      }
      .travel-art-vignette:hover .tree-6 {
        animation: treeSway 1.7s ease-in-out infinite 0.05s;
        transform-origin: 114px 35px;
      }
      .travel-art-vignette:hover .tree-7 {
        animation: treeSway 2.3s ease-in-out infinite 0.35s;
        transform-origin: 130px 35px;
      }
      .travel-art-vignette:hover .tree-8 {
        animation: treeSway 1.9s ease-in-out infinite 0.2s;
        transform-origin: 144px 35px;
      }
      .travel-art-vignette:hover .tree-9 {
        animation: treeSway 2.0s ease-in-out infinite 0.1s;
        transform-origin: 162px 35px;
      }

      @keyframes treeSway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(4.5deg); }
        75% { transform: rotate(-3.5deg); }
      }

      /* River Flow Animation */
      .travel-art-vignette .wave-1 {
        transition: stroke 240ms ease;
      }
      .travel-art-vignette:hover .wave-1 {
        animation: waveFlow 1.6s ease-in-out infinite;
        stroke: var(--accent);
      }

      .travel-art-vignette .wave-2 {
        transition: stroke 240ms ease, opacity 240ms ease;
      }
      .travel-art-vignette:hover .wave-2 {
        animation: waveFlowReverse 1.9s ease-in-out infinite;
        stroke: #488f9c;
        opacity: 0.95;
      }

      @keyframes waveFlow {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }

      @keyframes waveFlowReverse {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(-2.5px); }
      }

      /* Active state on travel.html */
      .travel-art-vignette.active .forest-reveal-group {
        transform: translateY(0);
        opacity: 0.85;
        filter: blur(0);
      }
      .travel-art-vignette.active .forest-reveal-title {
        fill: var(--accent);
        font-weight: 600;
      }
      .travel-art-vignette.active .vignette-sun circle {
        stroke: var(--earth-amber, #A06A42);
      }

      .site-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px clamp(24px, 5vw, 80px) 20px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      .footer-rule {
        flex: 1;
        height: 1px;
        margin: 0 18px;
        background: var(--line);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .page { padding: 64px 20px 52px; justify-content: flex-start; }
        .site-header { grid-template-columns: 1fr auto; gap: 9px 14px; padding: 14px 20px 10px; }
        .header-right { grid-column: 2; grid-row: 1; justify-self: end; }
        .travel-art-vignette { width: 148px; height: 30px; }
        .top-nav { grid-column: 1 / -1; grid-row: 2; gap: 0 15px; }
        .nav-link { font-size: 9px; }
        .field { font-size: 8px; }
        main { margin: 0 auto; padding: 16px 0 24px; max-height: none; }
        h1 { font-size: clamp(4.2rem, 18vw, 6.2rem); line-height: 0.78; }
        .contact-hero-grid { grid-template-columns: 1fr; gap: 24px; }
        .owner-portrait-wrapper { justify-content: flex-start; margin-top: 0; }
        .portrait-frame { width: min(180px, 48vw); }
        .site-footer { padding: 10px 20px 12px; font-size: 8px; }
        .footer-rule { max-width: 64px; margin: 0 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="index.html">Santanu Saha</a>
        <nav class="top-nav" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="research.html">Research</a>
          <a class="nav-link" href="cv.html">CV</a>
          <a class="nav-link active" href="contact.html">Contact</a>
        </nav>
        <div class="header-right">
          <a class="travel-art-vignette" href="travel.html" aria-label="Travel Stories">
            <svg class="travel-vignette-svg" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- 1. Topographic Sky Contours & Radiant Sun & Birds -->
              <g class="vignette-sky">
                <path d="M12 13 C45 9, 85 15, 120 11" stroke="rgba(160, 106, 66, 0.22)" stroke-width="0.75" stroke-dasharray="2 3" />
                <!-- Sun with halo and rays at (156, 11) -->
                <g class="vignette-sun">
                  <circle cx="156" cy="11" r="4.2" stroke="var(--earth-amber, #A06A42)" stroke-width="1.1" fill="none" />
                  <circle cx="156" cy="11" r="7.5" stroke="rgba(160, 106, 66, 0.45)" stroke-width="0.7" stroke-dasharray="1.5 2" fill="none" />
                  <line x1="156" y1="4" x2="156" y2="2" stroke="var(--earth-amber, #A06A42)" stroke-width="0.85" stroke-linecap="round" />
                  <line x1="162" y1="6.5" x2="164" y2="5" stroke="var(--earth-amber, #A06A42)" stroke-width="0.85" stroke-linecap="round" />
                  <line x1="150" y1="6.5" x2="148" y2="5" stroke="var(--earth-amber, #A06A42)" stroke-width="0.85" stroke-linecap="round" />
                  <line x1="164.5" y1="11" x2="166.5" y2="11" stroke="var(--earth-amber, #A06A42)" stroke-width="0.85" stroke-linecap="round" />
                  <line x1="147.5" y1="11" x2="145.5" y2="11" stroke="var(--earth-amber, #A06A42)" stroke-width="0.85" stroke-linecap="round" />
                </g>
                <!-- Soaring Birds -->
                <g class="vignette-birds">
                  <path class="vignette-bird bird-1" d="M34 8.5 C32 6.5, 30 6.5, 28 8 M34 8.5 C36 6.5, 38 6.5, 40 8" stroke="var(--ink)" stroke-width="1.05" stroke-linecap="round" fill="none" />
                  <path class="vignette-bird bird-2" d="M46 5.5 C44.5 4, 43 4, 41.5 5.2 M46 5.5 C47.5 4, 49 4, 50.5 5.2" stroke="var(--ink)" stroke-width="0.85" stroke-linecap="round" fill="none" />
                </g>
              </g>

              <!-- 2. Distant Soft Mountain Range -->
              <g class="vignette-mtn-back">
                <path d="M4 36 L24 23 L52 14 L80 23 L110 13 L138 22 L168 11 L196 26 L196 36 L4 36 Z"
                      fill="var(--paper, #F6F7F2)" stroke="rgba(47, 106, 79, 0.42)" stroke-width="0.9" stroke-linejoin="round" />
                <!-- Subtle Ridge Hatchings -->
                <path d="M52 14 L50 20 L53 26 M110 13 L108 19 L111 25 M168 11 L166 18" stroke="rgba(47, 106, 79, 0.35)" stroke-width="0.75" stroke-dasharray="1 1.5" fill="none" />
              </g>
