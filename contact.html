<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Santanu Saha — Contact information, academic profiles, and social links."

    <title>Contact — Santanu Saha</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap");

      :root {
        --paper: #fffaf4;
        --ink: #18201e;
        --muted: #707670;
        --line: #d9d9d1;
        --accent: #5ba8b8;
        --accent-soft: #cae9ed;
        --pastel-peach: #ffc7b2;
        --pastel-blue: #bfe4f0;
        --pastel-lilac: #dbccf5;
        --pastel-yellow: #ffe3a3;
        --pastel-mint: #bde8d0;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Manrope", Arial, sans-serif;
        --mono: "DM Mono", monospace;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          radial-gradient(circle at 86% 16%, rgba(255, 199, 178, 0.72), transparent 26rem),
          radial-gradient(circle at 11% 91%, rgba(191, 228, 240, 0.72), transparent 24rem),
          radial-gradient(circle at 57% 53%, rgba(219, 204, 245, 0.48), transparent 29rem);
        background-attachment: fixed;
        font-family: var(--sans);
      }

      a { color: inherit; text-decoration: none; }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        padding: 28px clamp(24px, 5vw, 80px) 26px;
        isolation: isolate;
      }

      .page::before,
      .page::after {
        position: fixed;
        z-index: 0;
        width: clamp(130px, 18vw, 240px);
        aspect-ratio: 1;
        border-radius: 50%;
        content: "";
        filter: blur(2px);
        opacity: 0.62;
        pointer-events: none;
      }

      .page::before {
        top: 20%;
        left: 19%;
        background: radial-gradient(circle at 34% 30%, rgba(255, 227, 163, 0.72), rgba(255, 227, 163, 0.08) 68%, transparent 70%);
      }

      .page::after {
        right: 22%;
        bottom: 13%;
        background: radial-gradient(circle at 50% 50%, rgba(189, 232, 208, 0.64), rgba(189, 232, 208, 0.05) 68%, transparent 70%);
      }

      .grain {
        position: fixed;
        z-index: 1;
        inset: 0;
        pointer-events: none;
        opacity: 0.24;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
      }

      .site-header,
      .site-footer {
        position: relative;
        z-index: 10;
        display: grid;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .site-header {
        grid-template-columns: 1fr auto 1fr;
        align-self: start;
      }

      .brand {
        font-weight: 500;
        transition: color 200ms ease;
      }

      .brand:hover {
        color: var(--accent);
      }

      .field {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        justify-self: end;
      }

      .field::before {
        width: 6px;
        height: 6px;
        border: 1px solid var(--accent);
        border-radius: 50%;
        content: "";
        transition: background 300ms ease, transform 300ms ease;
      }

      .field:hover::before {
        background: var(--accent);
        transform: scale(1.35);
      }

      main {
        display: grid;
        align-self: center;
        position: relative;
        z-index: 10;
        width: min(100%, 1160px);
        margin: 4vh auto 3vh;
      }

      .contact-hero-grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) auto;
        justify-content: space-between;
        align-items: start;
        gap: clamp(32px, 5vw, 72px);
        width: 100%;
      }

      .hero-left-content {
        display: flex;
        flex-direction: column;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 20px;
        color: var(--accent);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 700ms 100ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .eyebrow::before {
        width: 28px;
        height: 1px;
        background: currentColor;
        content: "";
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(4.8rem, 11vw, 9.4rem);
        font-weight: 400;
        letter-spacing: -0.075em;
        line-height: 0.76;
        opacity: 0;
        animation: rise 900ms 180ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      h1 span { display: block; }

      h1 em {
        margin-left: clamp(12px, 4vw, 62px);
        font-style: italic;
      }

      /* Owner portrait positioned top right */
      .owner-portrait-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        align-self: start;
        margin-top: 6px;
        padding: 10px;
        opacity: 0;
        animation: rise 850ms 220ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .owner-portrait-wrapper::before {
        position: absolute;
        content: "";
        width: 114%;
        height: 114%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--accent-soft) 0%, rgba(255, 199, 178, 0.28) 50%, transparent 70%);
        filter: blur(16px);
        z-index: 0;
        pointer-events: none;
      }

      .portrait-frame {
        position: relative;
        z-index: 1;
        width: clamp(210px, 22vw, 290px);
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--paper);
        box-shadow:
          0 0 0 1px var(--line),
          0 0 0 8px var(--accent-soft),
          0 18px 40px -12px rgba(24, 32, 30, 0.16);
        background: var(--paper);
        transition: box-shadow 300ms ease, transform 300ms ease;
      }

      .portrait-frame:hover {
        transform: scale(1.025);
        box-shadow:
          0 0 0 1px var(--accent),
          0 0 0 10px var(--accent-soft),
          0 22px 46px -10px rgba(24, 32, 30, 0.22);
      }

      .portrait-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .contact-details {
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 540px;
        margin-top: clamp(28px, 4vh, 48px);
        opacity: 0;
        animation: rise 800ms 350ms cubic-bezier(.2,.8,.2,1) forwards;
      }

      .direct-contact-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }

      .contact-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 250, 244, 0.65);
        backdrop-filter: blur(8px);
        transition: border-color 240ms ease, transform 240ms ease, background 240ms ease;
      }

      .contact-card:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
      }

      .card-tag {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .card-tag svg {
        width: 13px;
        height: 13px;
        fill: currentColor;
      }

      .card-value {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink);
        word-break: break-all;
        transition: color 200ms ease;
      }

      .contact-card:hover .card-value {
        color: var(--accent);
      }

      .social-heading {
        margin: 6px 0 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .social-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(245, 244, 239, 0.7);
        backdrop-filter: blur(6px);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: border-color 250ms ease, background 250ms ease, color 250ms ease, transform 250ms ease;
      }

      .social-pill svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
        flex-shrink: 0;
        transition: transform 220ms ease;
      }

      .social-pill .external-arrow {
        color: var(--accent);
        font-size: 12px;
        opacity: 0.75;
        transition: transform 220ms ease, opacity 220ms ease;
      }

      .social-pill:hover {
        border-color: var(--accent);
        color: var(--ink);
        background: var(--accent-soft);
        transform: translateY(-2px);
      }

      .social-pill:hover svg {
        transform: scale(1.1);
      }

      .social-pill:hover .external-arrow {
        opacity: 1;
        transform: translate(2px, -2px);
      }

      .top-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 18px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 4px 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-link::before {
        color: var(--accent);
        content: "↗";
        font-size: 13px;
        opacity: 0;
        transform: translate(-5px, 4px);
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .nav-link:hover::before,
      .nav-link:focus-visible::before {
        opacity: 1;
        transform: translate(0, 0);
      }

      .nav-link.active {
        color: var(--accent);
      }

      .nav-link:focus-visible,
      .contact-card:focus-visible,
      .social-pill:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 4px;
      }

      .site-footer {
        grid-template-columns: auto minmax(40px, 1fr) auto;
        align-self: end;
        padding-right: 0;
        color: var(--muted);
      }

      .footer-rule {
        flex: 1;
        max-width: 180px;
        height: 1px;
        margin: 0 18px;
        background: var(--line);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .page { padding: 22px 22px 20px; }
        .site-header { grid-template-columns: 1fr auto; gap: 9px 14px; }
        .top-nav { grid-column: 1 / -1; grid-row: 2; gap: 0 15px; }
        .nav-link { font-size: 9px; }
        .field { font-size: 8px; }
        main { margin: 6vh auto 4vh; }
        h1 { font-size: clamp(4.2rem, 18vw, 6.2rem); line-height: 0.78; }
        .contact-hero-grid { grid-template-columns: 1fr; gap: 24px; }
        .owner-portrait-wrapper { justify-content: flex-start; margin-top: 0; }
        .portrait-frame { width: min(180px, 48vw); }
        .site-footer { padding-right: 0; font-size: 8px; }
        .footer-rule { max-width: 64px; margin: 0 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
